<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28">
  <!-- Colour icon for the editor toolbar: a slide with its labels covered.
       Anki inverts editor icons in night mode; the button opts out of that
       (see _add_editor_button), so it looks the same on light and dark. -->
  <rect x="1" y="1" width="26" height="26" rx="6.5" fill="#6e5aa8"/>
  <rect x="4.5" y="6.5" width="19" height="15" rx="2.2" fill="#ffffff"/>
  <circle cx="10" cy="14" r="3.3" fill="#d8d0ef"/>
  <rect x="15" y="9.6" width="6" height="2.6" rx="0.9" fill="#8f8f96"/>
  <rect x="15" y="13.6" width="6" height="2.6" rx="0.9" fill="#6e5aa8"/>
  <rect x="15" y="17.6" width="4.5" height="1.6" rx="0.8" fill="#c9c9ce"/>
</svg>
