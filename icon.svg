<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28">
  <!-- One colour only: Anki inverts editor icons in night mode, so a coloured
       icon turns into its opposite hue there (purple came out green). A dark
       monochrome icon becomes a light one, like Anki's own buttons. -->
  <rect x="3" y="1" width="16" height="22" rx="2" fill="none" stroke="#1d1d1f" stroke-opacity="0.8" stroke-width="1.4"/>
  <line x1="6" y1="6" x2="16" y2="6" stroke="#1d1d1f" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="6" y1="9" x2="16" y2="9" stroke="#1d1d1f" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="6" y1="12" x2="13" y2="12" stroke="#1d1d1f" stroke-opacity="0.35" stroke-width="1"/>
  <rect x="10" y="14" width="8" height="6" rx="1" fill="#1d1d1f" fill-opacity="0.8"/>
  <circle cx="22" cy="22" r="6" fill="#1d1d1f"/>
  <line x1="22" y1="19" x2="22" y2="25" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="19" y1="22" x2="25" y2="22" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
</svg>
